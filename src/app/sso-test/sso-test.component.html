<div style="padding: 24px; font-family: sans-serif;">
  <h2>Prueba de SSO (Fanasa)</h2>

  <button (click)="login()" [disabled]="loading">
    {{ loading ? 'Conectando...' : 'Iniciar sesión con Microsoft' }}
  </button>

  <p *ngIf="error" style="color:red">{{ error }}</p>

  <h3 *ngIf="token">Token SSO:</h3>
  <pre *ngIf="token" style="background:#f4f4f4; padding:12px; overflow:auto;">{{ token | json }}</pre>

  <h3 *ngIf="user">Usuario SSO:</h3>
  <pre *ngIf="user" style="background:#f4f4f4; padding:12px; overflow:auto;">{{ user | json }}</pre>
</div>
